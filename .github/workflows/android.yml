name: Android build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Validate version
        run: python3 scripts/release_metadata.py
      - name: Test timer state
        run: |
          mkdir -p build/core-tests
          javac -d build/core-tests shared/src/main/java/com/hwserve/still/TimerState.java tests/TimerStateTest.java
          java -cp build/core-tests TimerStateTest
      - name: Build and lint both apps
        run: ./gradlew :phone:assembleDebug :wear:assembleDebug :phone:lintDebug :wear:lintDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-apks
          path: |
            phone/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - id: version
        run: python3 scripts/release_metadata.py >> "$GITHUB_OUTPUT"
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.STILL_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/still-release.jks"
      - name: Build signed release APKs
        env:
          STILL_KEYSTORE: ${{ runner.temp }}/still-release.jks
          STILL_KEYSTORE_PASSWORD: ${{ secrets.STILL_KEYSTORE_PASSWORD }}
        run: ./gradlew :phone:assembleRelease :wear:assembleRelease --no-daemon
      - name: Stage installable files
        run: |
          mkdir -p dist
          cp phone/build/outputs/apk/release/phone-release.apk dist/still-phone.apk
          cp wear/build/outputs/apk/release/wear-release.apk dist/still-wear.apk
          cd dist
          sha256sum still-phone.apk still-wear.apk > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "Still $RELEASE_VERSION" --generate-notes --latest
          fi
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/still-release.jks"
